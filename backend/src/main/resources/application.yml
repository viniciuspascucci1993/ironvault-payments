spring:
  application:
    name: payments-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:ironvault}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

app:
  webhook:
    mock-secret: ${WEBHOOK_SECRET}
    signature-tolerance-seconds: 300
  mercadopago:
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN}
  jwt:
    secret: ${JWT_SECRET}